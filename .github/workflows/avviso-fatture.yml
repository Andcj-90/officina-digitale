name: Avviso fatture

# Quando una proposta di modifica tocca il calcolo delle fatture,
# lascia un commento che ricorda di avvisare l'amministrazione prima del merge.

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "src/fatture.js"
      - "test/**"

permissions:
  pull-requests: write

jobs:
  avviso:
    name: Avviso modifica fatture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const segno = "<!-- avviso-fatture -->";
            const testo = segno + "\nQuesta modifica tocca il calcolo delle fatture: va avvisato chi si occupa di amministrazione prima del merge.";
            const commenti = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            if (commenti.some((commento) => commento.body.includes(segno))) return;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: testo,
            });
